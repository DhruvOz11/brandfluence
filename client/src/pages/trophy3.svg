<svg width="60" height="60" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Gradient for Gold Effect -->
  <defs>
    <linearGradient id="gold-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>  <!-- Bright Gold -->
      <stop offset="50%" stop-color="#FFC107"/> <!-- Slightly Darker Gold -->
      <stop offset="100%" stop-color="#B8860B"/> <!-- Deep Gold -->
    </linearGradient>

    <!-- Highlight Effect -->
    <radialGradient id="highlight" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="white" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="gold" stop-opacity="0"/>
    </radialGradient>

    <!-- Shadow Effect -->
    <radialGradient id="shadow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="black" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="gold" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Trophy Body with Gold Gradient -->
  <path d="M21 3H17V2C17 1.45 16.55 1 16 1H8C7.45 1 7 1.45 7 2V3H3C2.45 3 2 3.45 2 4V7C2 10.31 4.69 13 8 13H8.18C8.6 14.16 9.41 15.11 10.5 15.58V18H7C6.45 18 6 18.45 6 19V20H18V19C18 18.45 17.55 18 17 18H13.5V15.58C14.59 15.11 15.4 14.16 15.82 13H16C19.31 13 22 10.31 22 7V4C22 3.45 21.55 3 21 3ZM4 7V5H7V10.9C5.29 10.4 4 8.83 4 7ZM20 7C20 8.83 18.71 10.4 17 10.9V5H20V7Z"
    fill="url(#gold-gradient)" stroke="goldenrod" stroke-width="0.5"/>

  <!-- Trophy Highlights -->
  <path d="M19 3H16V2C16 1.5 15.5 1 15 1H9C8.5 1 8 1.5 8 2V3H5C4.5 3 4 3.5 4 4V7C4 9.5 6 12 8 12H8.2C8.5 13 9.5 14 10.5 14.5V16H9C8.5 16 8 16.5 8 17V18H16V17C16 16.5 15.5 16 15 16H13.5V14.5C14.5 14 15.5 13 15.8 12H16C18 12 20 9.5 20 7V4C20 3.5 19.5 3 19 3Z"
    fill="url(#highlight)" opacity="0.6"/>

  <!-- Trophy Shadows -->
  <path d="M5 7C5 9 7 11 9 11C7 9.5 5.5 8 5 7Z" fill="url(#shadow)" opacity="0.3"/>
  <path d="M19 7C19 9 17 11 15 11C17 9.5 18.5 8 19 7Z" fill="url(#shadow)" opacity="0.3"/>

</svg>
